name: Commit CI

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-2022
    env:
      boost_version: 1.84.0
      BOOST_ROOT: ${{ github.workspace }}\deps\boost_1_84_0
    steps:
      - name: Install Visual Studio Workload with ATL/MFC
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 修改安装路径为默认 VS2022
          $vsPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
          & "$vsPath\Installer\vs_installer.exe" modify `
            --installPath "$vsPath" `
            --add Microsoft.VisualStudio.Component.VC.ATL `
            --includeRecommended `
            --quiet `
            --norestart

      - name: Checkout last commit
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --tags

      - name: Configure build environment
        shell: bash
        run: |
          cp env.vs2019.bat env.bat
          echo git_ref_name="$(git describe --always)" >> $GITHUB_ENV

      - name: Cache Boost
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BOOST_ROOT }}
          key: ${{ runner.os }}-boost-${{ env.boost_version }}

      - name: Install Boost
        if: steps.cache-boost.outputs.cache-hit != 'true'
        shell: bash
        run: |
          ./install_boost.bat
          ./build.bat boost

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Copy Rime files
        run: |
          .\github.install.bat

      - name: Build data
        run: |
          .\build.bat data

      - name: Build Weasel
        id: build_weasel
        run: |
          .\build.bat installer

      - name: Compress Debug Symbols
        shell: pwsh
        run: |
          output\7z.exe a -t7z "./output/archives/debug_symbols.7z" "output/*.pdb" -r

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weasel-artifact-${{ env.git_ref_name }}
          if-no-files-found: error
          path: |
            .\output\archives\weasel*.exe
            .\output\archives\debug_symbols.7z
