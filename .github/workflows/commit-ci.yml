name: Commit CI

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-2022
    env:
      boost_version: 1.84.0
      BOOST_ROOT: ${{ github.workspace }}\deps\boost_1_84_0
    steps:
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: 14.29
          sdk: 10.0.19041.0

      - name: Download and extract atlmfc
        run: |
          # 创建目标目录
          $targetDir = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC\14.29.30133"

          # 下载文件
          $url = "https://github.com/aaravlu/test_workflows/releases/download/ATL/atlmfc.7z"
          $output = "atlmfc.7z"
          Invoke-WebRequest -Uri $url -OutFile $output

          # 安装 7zip (如果系统没有的话)
          if (-not (Get-Command "7z" -ErrorAction SilentlyContinue)) {
            choco install 7zip -y --no-progress
          }

          # 解压文件
          7z x atlmfc.7z -o"$targetDir"

          # 验证文件
          if (Test-Path "$targetDir\atlmfc") {
            Write-Host "atlmfc directory successfully extracted"
          } else {
            Write-Error "Extraction failed - atlmfc directory not found"
            exit 1
          }

      - name: Check ATL installation
        run: |
          $atlPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC\14.29.30133\atlmfc\include\atlbase.h"
          if (Get-ChildItem $atlPath) {
              Write-Host "✅ ATL is installed."
          } else {
              Write-Error "❌ ATL is NOT installed!"
              exit 1
          }

      - name: Checkout last commit
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --tags

      - name: Configure build environment
        shell: bash
        run: |
          cp env.vs2019.bat env.bat
          echo git_ref_name="$(git describe --always)" >> $GITHUB_ENV

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: 14.29
          sdk: 10.0.19041.0

      - name: Install Boost
        shell: bash
        run: |
          ./install_boost.bat
          ./build.bat boost

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Copy Rime files
        run: |
          .\github.install.bat

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: 14.29
          sdk: 10.0.19041.0

      - name: Build data
        run: |
          .\build.bat data

      - name: Build Weasel
        id: build_weasel
        run: |
          .\build.bat installer

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weasel-artifact-${{ env.git_ref_name }}
          if-no-files-found: error
          path: |
            .\x64\Release\*.exe
            .\x64\Release\*.dll
